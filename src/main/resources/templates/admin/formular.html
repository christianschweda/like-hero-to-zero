<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wert erfassen · Like Hero To Zero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1 th:text="${formular.id == null} ? 'Neuen Wert eintragen' : 'Wert korrigieren'">Wert erfassen</h1>
    <p>Bereich für Wissenschaftler:innen</p>
</header>

<main>
    <!-- Fehlermeldung aus dem Service (fachliche Prüfung) -->
    <p th:if="${fehler}" class="fehler" th:text="${fehler}">Fehler</p>

    <form th:action="@{/admin/emissionen/speichern}" th:object="${formular}" method="post" class="formular" >

    <input type="hidden" th:field="*{id}">

        <!-- Land -->
        <label for="landIsoCode">Land</label>
        <select th:if="*{id == null}" id="landIsoCode" th:field="*{landIsoCode}"
                th:errorclass="feld-fehler" required>
            <option value="">Bitte wählen …</option>
            <option th:each="l : ${laender}" th:value="${l.isoCode}" th:text="${l.name}">Land</option>
        </select>
        <th:block th:if="*{id != null}">
            <strong th:each="l : ${laender}" th:if="${l.isoCode == formular.landIsoCode}" th:text="${l.name}">Land</strong>
            <input type="hidden" th:field="*{landIsoCode}">
        </th:block>
        <span class="feldfehler" th:if="${#fields.hasErrors('landIsoCode')}" th:errors="*{landIsoCode}">Fehler</span>

        <!-- Jahr -->
        <label for="jahr">Jahr</label>
        <input type="number" id="jahr" th:field="*{jahr}" th:errorclass="feld-fehler" required>
        <span class="feldfehler" th:if="${#fields.hasErrors('jahr')}" th:errors="*{jahr}">Fehler</span>

        <!-- CO2-Wert -->
        <label for="co2Mt">CO₂-Ausstoß (Mio. Tonnen)</label>
        <input type="number" step="any" min="0" id="co2Mt" th:field="*{co2Mt}" th:errorclass="feld-fehler" required>
        <span class="feldfehler" th:if="${#fields.hasErrors('co2Mt')}" th:errors="*{co2Mt}">Fehler</span>

        <div class="knoepfe">
            <button type="submit">Speichern</button>
            <a th:href="@{/admin/emissionen(land=${formular.landIsoCode})}">Abbrechen</a>
        </div>
    </form>
</main>

</body>
</html>
