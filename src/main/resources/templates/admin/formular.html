<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wert erfassen · Like Hero To Zero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1 th:text="${formular.id == null} ? 'Neuen Wert eintragen' : 'Wert korrigieren'">Wert erfassen</h1>
    <p>Bereich für Wissenschaftler:innen</p>
</header>

<main>
    <!-- Fehlermeldung aus dem Service -->
    <p th:if="${fehler}" class="fehler" th:text="${fehler}">Fehler</p>

    <form th:action="@{/admin/emissionen/speichern}" th:object="${formular}" method="post" class="formular">

        <!-- versteckt: id des Eintrags (leer bei neuem Wert) -->
        <input type="hidden" th:field="*{id}">

        <label for="landIsoCode">Land</label>
        <!-- Neuer Eintrag: Land auswählbar -->
        <select th:if="*{id == null}" th:field="*{landIsoCode}" required>
            <option value="">Bitte wählen …</option>
            <option th:each="l : ${laender}" th:value="${l.isoCode}" th:text="${l.name}">Land</option>
        </select>
        <!-- Bearbeiten: Land nur anzeigen, nicht änderbar -->
        <th:block th:if="*{id != null}">
            <strong th:each="l : ${laender}" th:if="${l.isoCode == formular.landIsoCode}" th:text="${l.name}">Land</strong>
            <input type="hidden" th:field="*{landIsoCode}">
        </th:block>

        <label for="jahr">Jahr</label>
        <input type="number" th:field="*{jahr}" required>

        <label for="co2Mt">CO₂-Ausstoß (Mio. Tonnen)</label>
        <input type="number" step="any" min="0" th:field="*{co2Mt}" required>

        <div class="knoepfe">
            <button type="submit">Speichern</button>
            <a th:href="@{/admin/emissionen(land=${formular.landIsoCode})}">Abbrechen</a>
        </div>
    </form>
</main>

</body>
</html>
